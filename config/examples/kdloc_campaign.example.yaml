# KdLocalizer campaign definition: everything dataset-specific the run side needs.
#
# Copy it to <campaign dir>/campaign.yaml, then:
#   python3 $SDP/src/kdloc/make_runs.py <campaign dir>       -> runs/<name>/ + runs.tsv + campaign.env
#   $SDP/scripts/kdloc/campaign.sh <campaign dir>            on the machine that runs the localizer
#   python3 $SDP/src/kdloc/evaluate.py <campaign dir> --reference <dir of TUM files>
#
# Relative paths are relative to the campaign directory. The campaign directory and the
# slam_dataset_pipeline checkout must be mounted at the same paths inside the container as on
# the host (compose.yaml in the campaign directory), because the generated files carry
# absolute paths. Unknown keys are refused, so a misspelt option cannot be ignored silently.
# Write floating-point ROS parameters with a decimal point (0.5, not 1 for 1.0): ROS 2 refuses
# an integer for a double parameter.
#
# This example is the LUH entrance-hall campaign of 2026-10-15 (72 runs).

container:
  service: kdloc                       # docker compose service in <campaign dir>/compose.yaml
  # ros_setup: /opt/ros/humble/setup.bash          (default)
  # kd_setup: /home/kudan/ros2_ws/install/setup.bash  (default: ~/ros2_ws/install/setup.bash)

# sdp: sdp                             # checkout used on the localizer machine (default: this one)

topics:
  lidar: /ouster/points
  imu: /ouster/imu

frames:
  map: map                             # default map
  odom: odom                           # default odom
  base: os_lidar                       # base_frame_id of both nodes; the pose that gets scored

# Published for the whole run, one tf2_ros static_transform_publisher per entry. Leave out when
# the bag carries /tf_static.
static_tf:
  - --x -0.006253 --y 0.011775 --z -0.030550 --qx 0 --qy 0 --qz 1 --qw 0 --frame-id os_lidar --child-frame-id os_imu

# dds_profile: config/dds/fastdds_shm_big.xml   (default; relative to sdp). Its segment must
#              hold several clouds and its maxMessageSize one whole cloud.
ros_domain_id: 42                      # default 42
startup_timeout_s: 180                 # localizer activation and BBS map load (default 180)
# play_rate: 1.0                       # default 1.0 (real time)

# localizer_config: { ... }            # the whole config_file; default: the config used by every
#                                      # Jetson campaign since 2.0.0 (make_runs.STANDARD_LOCALIZER_CONFIG)
localizer_params:                      # extra kd_localizer_node parameters (defaults below)
  lidar_exclude_radius: 0.5            #   default 0.5
  process_stats_log_interval_sec: 10   #   default 10
  # publish_tf: false                  #   default false
relocalizer_params:                    # extra kd_relocalizer_node parameters
  lidar_exclude_radius: 0.5            #   default 0.5

maps:
  tls: maps/tls/localizer_map.kdm

sequences:
  s2:
    bag: bags/sequence2
    initial_pose:                      # per map; only needed by groups with initial_pose: true
      tls:
        position: [26.176800, 10.768500, -0.354700]
        orientation: [-0.00300714, 0.00171136, 0.94989680, 0.31254454]   # qx qy qz qw
        # or: rotation: [roll, pitch, yaw]   (rad, R = Rz(yaw) Ry(pitch) Rx(roll))
  s5:
    bag: bags/sequence5
    initial_pose:
      tls:
        position: [0.0, 0.0, 0.0]
        orientation: [0.0, 0.0, 0.0, 1.0]

# One entry per kind of run. Each group runs on every sequence and every map unless it lists
# `sequences` / `maps`. Run names: <kind>_<sequence>[_in_<map> with several maps][_r<k> when repeated].
groups:
  - kind: warm                         # letters, digits and single underscores
    initial_pose: true                 # start from sequences.<seq>.initial_pose.<map>; skipped where missing
    method: bbs3d_gpu                  # relocalizer backend: bbs3d_gpu (default) or bbs3d_cpu
    # reloc_delay: 30                  # s after the bag starts; default 30 with an initial pose, else 0
  - kind: coldgpu
    method: bbs3d_gpu
  - kind: coldcpu
    method: bbs3d_cpu
  - kind: coldgpu_t06
    method: bbs3d_gpu
    repeats: 3
    relocalizer_params: {score_threshold_percentage: 0.6}
  - kind: coldcpu_t06
    method: bbs3d_cpu
    repeats: 3
    relocalizer_params: {score_threshold_percentage: 0.6}
  # Other group keys:
  #   sequences: [s2]   maps: [tls]     restrict the group
  #   localizer_config: {...}           merged into the campaign's localizer config
  #   localizer_params: {...}           merged into the kd_localizer_node parameters
  #   limit_s: 60                       play only the first 60 s of each bag
